services:
  backend:
    build: ./backend
    container_name: pdfforge-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - pdfforge_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/pdfforge.db
      - SECRET_KEY=${SECRET_KEY:-super-secret-change-me}
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000","https://${DOMAIN:-localhost}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: pdfforge-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-localhost}

volumes:
  pdfforge_data:
